<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青研 · 时序波形工作台</title><style>body{font-family:system-ui;background:#f5f5f1;color:#252b32;margin:0}header{padding:20px 5%;background:#fff;border-bottom:1px solid #ddd}h1{margin:0;font-size:24px}main{max-width:1150px;margin:20px auto;padding:0 14px}section{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:14px}button,input,select{padding:9px;border:1px solid #ccc;border-radius:7px;background:white;margin:3px}button{cursor:pointer}button:hover{background:#edf4ef}.primary{background:#225f52;color:white}#board{overflow:auto;touch-action:pan-x}svg{display:block;min-width:800px}label{display:inline-block;margin:4px}small{color:#666}</style><header><h1>青研 · 时序波形工作台</h1><small>点击格子切换 0 → 1 → X · 自动时钟 · 边沿触发器 · SVG / PNG / JSON 导出</small></header><main><section><button class="primary" onclick="add()">＋ 添加信号</button><button onclick="clock()">＋ CLK</button><button onclick="flip()">＋ D 触发器 Q</button><button onclick="undo()">撤销</button><button onclick="redo()">重做</button><button onclick="save('svg')">导出 SVG</button><button onclick="save('png')">导出 PNG</button><button onclick="save('json')">保存工程</button><label>载入工程<input type="file" accept=".json" onchange="load(event)"></label><label>格数 <input id="count" type="number" min="4" max="100" value="16" style="width:65px" onchange="resize()"></label></section><section id="board"><svg id="wave" xmlns="http://www.w3.org/2000/svg"></svg></section><section><b>编辑信号</b><div id="rows"></div><small>选择 D 触发器时：只在 CLK 指定有效边沿采样 D，其他时刻保持 Q。X 表示未知状态。</small></section></main><script>
let N=16,signals=[{name:'CLK',type:'clock',values:[]},{name:'D',type:'manual',values:[0,0,1,1,0,0,1,1,1,0,0,1,1,0,1,0]},{name:'Q',type:'dff',clk:'CLK',d:'D',edge:'rise',initial:0,values:[]}],history=[],future=[];
function snap(){history.push(JSON.stringify({N,signals}));if(history.length>80)history.shift();future=[]}
function restore(s){let o=JSON.parse(s);N=o.N;signals=o.signals;document.getElementById('count').value=N;draw()}
function undo(){if(history.length){future.push(JSON.stringify({N,signals}));restore(history.pop())}}
function redo(){if(future.length){history.push(JSON.stringify({N,signals}));restore(future.pop())}}
function add(){snap();signals.push({name:'S'+signals.length,type:'manual',values:Array(N).fill(0)});draw()}
function clock(){snap();signals.push({name:'CLK'+signals.length,type:'clock',values:[]});draw()}
function flip(){snap();signals.push({name:'Q'+signals.length,type:'dff',clk:signals.find(s=>s.type==='clock')?.name||'CLK',d:signals.find(s=>s.type==='manual')?.name||'D',edge:'rise',initial:0,values:[]});draw()}
function resize(){snap();N=Math.max(4,Math.min(100,+document.getElementById('count').value||16));draw()}
function calc(){for(let s of signals){if(s.type==='clock')s.values=Array.from({length:N},(_,i)=>i%2);else if(s.type==='manual'){s.values=Array.from({length:N},(_,i)=>s.values[i]??0)}}for(let s of signals.filter(s=>s.type==='dff')){let c=signals.find(x=>x.name===s.clk),d=signals.find(x=>x.name===s.d);let q=s.initial??0;s.values=[];for(let i=0;i<N;i++){let prev=i===0?0:c?.values[i-1],now=c?.values[i];if(c&&d&&((s.edge==='fall'&&prev===1&&now===0)||(s.edge!=='fall'&&prev===0&&now===1)))q=d.values[i]??'X';s.values.push(q)}}}
function set(i,k){let s=signals[i];if(s.type!=='manual')return;snap();s.values[k]=s.values[k]===0?1:s.values[k]===1?'X':0;draw()}
function edit(i,key,value){snap();signals[i][key]=value;draw()}
function remove(i){snap();signals.splice(i,1);draw()}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(){calc();let W=150+N*42,H=55+signals.length*82;let a=['<rect width="'+W+'" height="'+H+'" fill="white"/>'];for(let k=0;k<=N;k++){let x=150+k*42;a.push('<line x1="'+x+'" y1="32" x2="'+x+'" y2="'+H+'" stroke="#e2e5e6" stroke-dasharray="3 5"/><text x="'+(x+5)+'" y="23" font-size="12" fill="#888">'+k+'</text>')}signals.forEach((s,i)=>{let y=55+i*82; a.push('<text x="12" y="'+(y+25)+'" font-size="17" font-weight="600" fill="#283b40">'+esc(s.name)+'</text><line x1="0" x2="'+W+'" y1="'+(y+65)+'" y2="'+(y+65)+'" stroke="#f0f0f0"/>');for(let k=0;k<N;k++){let v=s.values[k],prev=s.values[k-1],x=150+k*42,hi=y+7,lo=y+45,cy=y+26;let yy=v===1?hi:v===0?lo:cy;if(k===0||prev!==v){let py=prev===1?hi:prev===0?lo:cy;if(k>0)a.push('<path d="M'+x+' '+py+'V'+yy+'" stroke="#246d70" stroke-width="2.5" fill="none"/>')}a.push('<path d="M'+x+' '+yy+'h42" stroke="'+(v==='X'?'#ba7741':'#246d70')+'" stroke-width="2.5" fill="none"/>');if(v==='X')a.push('<text x="'+(x+18)+'" y="'+(cy-6)+'" font-size="13" fill="#b76a2b">X</text>');if(s.type==='manual')a.push('<rect x="'+x+'" y="'+(y+2)+'" width="42" height="48" fill="transparent" onclick="set('+i+','+k+')" style="cursor:pointer"/>')}});let svg=document.getElementById('wave');svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.innerHTML=a.join('');document.getElementById('rows').innerHTML=signals.map((s,i)=>'<div style="padding:8px;border-bottom:1px solid #eee"><input aria-label="信号名称" value="'+esc(s.name)+'" style="width:90px" onchange="edit('+i+',\'name\',this.value)"><select onchange="edit('+i+',\'type\',this.value)"><option value="manual" '+(s.type==='manual'?'selected':'')+'>手动</option><option value="clock" '+(s.type==='clock'?'selected':'')+'>时钟</option><option value="dff" '+(s.type==='dff'?'selected':'')+'>D 触发器</option></select>'+(s.type==='dff'?'<label>CLK <select onchange="edit('+i+',\'clk\',this.value)">'+signals.map(x=>'<option '+(s.clk===x.name?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label><label>D <select onchange="edit('+i+',\'d\',this.value)">'+signals.map(x=>'<option '+(s.d===x.name?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label><select onchange="edit('+i+',\'edge\',this.value)"><option value="rise" '+(s.edge!=='fall'?'selected':'')+'>上升沿</option><option value="fall" '+(s.edge==='fall'?'selected':'')+'>下降沿</option></select><label>初态 <select onchange="edit('+i+',\'initial\',+this.value)"><option '+(s.initial===0?'selected':'')+'>0</option><option '+(s.initial===1?'selected':'')+'>1</option></select></label>':'')+'<button onclick="remove('+i+')">删除</button></div>').join('')}
function save(type){let svg=document.getElementById('wave');let source=new XMLSerializer().serializeToString(svg);let name='时序波形.'+type;if(type==='json')return download(new Blob([JSON.stringify({N,signals},null,2)],{type:'application/json'}),name);if(type==='svg')return download(new Blob([source],{type:'image/svg+xml'}),name);let im=new Image(),url=URL.createObjectURL(new Blob([source],{type:'image/svg+xml'}));im.onload=()=>{let c=document.createElement('canvas');c.width=im.width*2;c.height=im.height*2;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{download(b,name);URL.revokeObjectURL(url)})};im.src=url}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function load(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{snap();restore(r.result)}catch(e){alert('工程文件格式错误')}};r.readAsText(f)}
draw();
</script></html>
